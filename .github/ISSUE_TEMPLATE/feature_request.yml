name: Feature request
description: Describe a use case or supported-hand improvement.
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case and desired behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: References and validation
      description: Link relevant model/SDK documentation and describe how the change could be checked.
